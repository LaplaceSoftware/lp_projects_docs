name: Publish documentation

# Builds the MkDocs site and publishes it to the `gh-pages` branch.
#
# Why the branch approach rather than actions/deploy-pages:
# the Pages *deployment API* path (upload-pages-artifact + deploy-pages) got
# stuck in an `errored` site state and queued deployments indefinitely — a
# longer timeout did not help, because nothing was ever going to process them.
# Pushing the built site to a branch and serving it with Pages' "Deploy from a
# branch" source avoids that API entirely, and needs no repo-admin rights.
#
# Repository setting this expects:
#   Settings -> Pages -> Source: "Deploy from a branch"
#                        Branch: gh-pages  /  (root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Builds the site and force-pushes it to gh-pages, adding .nojekyll so
      # GitHub serves the files as-is instead of running them through Jekyll.
      # (Jekyll-building the raw repo is what made the earlier legacy Pages
      # build fail, which is what left the site in its errored state.)
      - name: Build and publish to gh-pages
        run: mkdocs gh-deploy --force --no-history
