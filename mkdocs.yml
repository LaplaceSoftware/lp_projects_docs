          - Getting Started: b2b_ecommerce_docs/_user_guide/001-Getting-Started.md
          - User Roles and Permissions: b2b_ecommerce_docs/_user_guide/002-User-Roles-and-Permissions.md
          - Client Portal — Navigation: b2b_ecommerce_docs/_user_guide/003-Client-Portal-Navigation.md
          - Client Portal — Browsing and Wishlists: b2b_ecommerce_docs/_user_guide/004-Client-Portal-Browsing-and-Wishlists.md
          - Client Portal — Orders: b2b_ecommerce_docs/_user_guide/005-Client-Portal-Orders.md
          - Client Portal — Company Management: b2b_ecommerce_docs/_user_guide/006-Client-Portal-Company-Management.md
          - AMP — Navigation: b2b_ecommerce_docs/_user_guide/007-Account-Manager-Portal-Navigation.md
          - AMP — Order Queues: b2b_ecommerce_docs/_user_guide/008-Account-Manager-Portal-Order-Queues.md
          - AMP — Working an Order: b2b_ecommerce_docs/_user_guide/009-Account-Manager-Portal-Working-an-Order.md
          - AMP — Product Management: b2b_ecommerce_docs/_user_guide/010-Account-Manager-Portal-Product-Management.md
          - AMP — Client Management: b2b_ecommerce_docs/_user_guide/011-Account-Manager-Portal-Client-Management.md
          - AMP — Pricing: b2b_ecommerce_docs/_user_guide/012-Account-Manager-Portal-Pricing.md
          - Messages and Notifications: b2b_ecommerce_docs/_user_guide/013-Messages-and-Notifications.md
          - The Order Lifecycle: b2b_ecommerce_docs/_user_guide/014-The-Order-Lifecycle.md
          - Common Business Scenarios: b2b_ecommerce_docs/_user_guide/015-Common-Business-Scenarios.md
          - AMP — Reports: b2b_ecommerce_docs/_user_guide/016-Account-Manager-Portal-Reports.md
          - Glossary: b2b_ecommerce_docs/_user_guide/017-Glossary.md

      - Technical Documentation:
          - Index: b2b_ecommerce_docs/_technical_docs/000-README.md
          - Project Overview: b2b_ecommerce_docs/_technical_docs/001-Project-Overview.md
          - System Architecture: b2b_ecommerce_docs/_technical_docs/002-System-Architecture.md
          - Repositories and Structure: b2b_ecommerce_docs/_technical_docs/003-Repositories-and-Structure.md
          - Odoo Modules: b2b_ecommerce_docs/_technical_docs/004-Odoo-Modules.md
          - Domain Model: b2b_ecommerce_docs/_technical_docs/005-Domain-Model.md
